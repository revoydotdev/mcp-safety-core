[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-safety-core"
version = "0.1.1"
description = "Single-source confirm-gating, structured-error (SERF), and tool-safety primitives shared across the revelri MCP portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "revelri" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
keywords = ["mcp", "model-context-protocol", "safety", "confirm", "agent"]

dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.16"]
fastmcp = ["fastmcp>=3.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_safety_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_safety_core --cov-fail-under=80 -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ARG"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
